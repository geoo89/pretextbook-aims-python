# Build the PreTeXt book in this repository and publish it on GitHub Pages.
#
# One-time setup on GitHub: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".
#
# Deliberately lean: no TeX, no Docker image. The web target only needs
# Python (the PreTeXt CLI) and Node.js >= 22.10 (PreTeXt pre-computes the
# fill-in-the-blank checks with Node). The build also fetches Runestone's
# JavaScript and computes the CodeLens traces online, so it needs network
# access, which GitHub runners have.

name: Build and deploy the book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install PreTeXt
        run: pip install -r requirements.txt

      - name: Build the web target
        run: pretext build web

      - uses: actions/upload-pages-artifact@v4
        with:
          path: output/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
